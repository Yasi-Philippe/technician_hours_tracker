<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="Registro delle ore lavorate" />
    <meta name="robots" content="noindex" />
    <!--
      No external origins are permitted. The app never contacts a server, and this
      header makes that a guarantee the browser enforces rather than a promise.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Cronos</title>
    <style>
      #boot {
        font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
        max-width: 420px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
        color: #0a0a0b;
      }
      #boot .boot-mark {
        width: 44px;
        height: 4px;
        background: #ce0e2d;
        margin: 0 auto 20px;
      }
      #boot .boot-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 6px;
      }
      #boot .boot-text {
        font-size: 15px;
        color: #52525b;
        margin: 0;
        line-height: 1.5;
        word-break: break-word;
      }
      #boot.is-error .boot-mark {
        width: 100%;
        height: 3px;
      }
    </style>
  </head>
  <body>
    <!--
      Shown before the app takes over, and left in place if it never does.

      A field app must never present a blank screen: if the script fails to parse, fails
      to load, or the database will not open, the technician is entitled to know that
      rather than stare at white. This is plain markup with no script of its own, so it
      survives exactly the failures that stop everything else.
    -->
    <div id="boot">
      <div class="boot-mark"></div>
      <p class="boot-title">Cronos</p>
      <p class="boot-text">Caricamento… · Cargando…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
